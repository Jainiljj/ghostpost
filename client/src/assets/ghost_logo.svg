<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background glow -->
  <circle cx="50" cy="50" r="40" fill="none" />
  <!-- Ghost Body -->
  <path d="M 50 15 
           C 25 15, 20 40, 20 60 
           C 20 75, 25 85, 30 80 
           C 35 75, 40 85, 50 80 
           C 60 85, 65 75, 70 80 
           C 75 85, 80 75, 80 60 
           C 80 40, 75 15, 50 15 Z" 
        fill="url(#ghostGrad)" 
        filter="url(#glow)" />
  <!-- Eyes -->
  <circle cx="40" cy="45" r="5" fill="#0a0813" />
  <circle cx="60" cy="45" r="5" fill="#0a0813" />
  <circle cx="41" cy="44" r="1.5" fill="#ffffff" />
  <circle cx="61" cy="44" r="1.5" fill="#ffffff" />
  <!-- Smiling mouth -->
  <path d="M 44 55 Q 50 60 56 55" fill="none" stroke="#0a0813" stroke-width="3" stroke-linecap="round" />
</svg>
